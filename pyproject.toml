[project]
name = "rag-toolkit"
version = "0.1.0"
description = "A lightweight modular retrieval toolkit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3", "pyyaml>=6,<7", "numpy>=1.26", "faiss-cpu>=1.8", "httpx>=0.27",
    "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "streamlit>=1.40,<2",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3"]
elasticsearch = ["elasticsearch>=8,<10"]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=8",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [".uv-cache"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[project.urls]
Repository = "https://github.com/ericqin-ai/rag-toolkit"
Issues = "https://github.com/ericqin-ai/rag-toolkit/issues"
