<svg xmlns="http://www.w3.org/2000/svg" width="680" height="650" viewBox="0 0 680 650" role="img" aria-labelledby="title desc"><title id="title">Hybrid retrieval architecture</title><desc id="desc">Query feeds BM25 and Dense independently, then Fusion, optional Reranker, Results with StageTrace, and Inspector or Evaluation. Independent does not mean concurrent execution.</desc><rect width="680" height="650" rx="12" fill="#F8FAFC"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#475569"/></marker></defs><g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"><path d="M340 85V110H180V140"/><path d="M340 110H500V140"/><path d="M180 210V240H340V270"/><path d="M500 210V240H340"/><path d="M340 330V365"/><path d="M340 425V460"/><path d="M340 520V545H180V575"/><path d="M340 545H500V575"/></g><g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle"><rect x="250" y="25" width="180" height="60" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/><text x="340.0" y="63.0" fill="#0F172A" font-size="24">Query</text><rect x="60" y="140" width="240" height="70" rx="10" fill="#F8FAFC" stroke="#6366F1" stroke-width="2"/><text x="180.0" y="183.0" fill="#0F172A" font-size="24">BM25</text><rect x="380" y="140" width="240" height="70" rx="10" fill="#F8FAFC" stroke="#6366F1" stroke-width="2"/><text x="500.0" y="183.0" fill="#0F172A" font-size="24">Dense</text><rect x="180" y="270" width="320" height="60" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/><text x="340.0" y="308.0" fill="#0F172A" font-size="24">RRF / Weighted Fusion</text><rect x="180" y="365" width="320" height="60" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/><text x="340.0" y="403.0" fill="#0F172A" font-size="24">Optional Reranker</text><rect x="140" y="460" width="400" height="60" rx="10" fill="#F8FAFC" stroke="#6366F1" stroke-width="2"/><text x="340.0" y="498.0" fill="#0F172A" font-size="24">Results + StageTrace</text><rect x="60" y="575" width="240" height="50" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/><text x="180.0" y="608.0" fill="#0F172A" font-size="24">Inspector</text><rect x="380" y="575" width="240" height="50" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/><text x="500.0" y="608.0" fill="#0F172A" font-size="24">Evaluation</text><text x="340" y="131" fill="#475569" font-size="17">independent recall</text></g></svg>
