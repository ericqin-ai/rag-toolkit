<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="title desc">
  <title id="title">RAG Toolkit — Retrieval Workbench</title>
  <desc id="desc">A modular Python toolkit. Independent BM25 and dense recall feed fusion, optional reranking and inspectable traces.</desc>
  <rect width="1280" height="320" rx="20" fill="#101C30"/>
  <g transform="translate(48 64)" fill="none" stroke="#54DCC4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 20h21l24 28h18M15 76h21l24-28"/>
    <rect x="2" y="9" width="19" height="22" rx="5"/><rect x="2" y="65" width="19" height="22" rx="5"/>
    <rect x="74" y="31" width="23" height="34" rx="6" fill="#F3F7FC" stroke="none"/>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="174" y="86" font-size="13" fill="#54DCC4" letter-spacing="2">RETRIEVAL WORKBENCH</text>
    <text x="170" y="144" font-size="54" font-weight="700" fill="#F3F7FC">RAG Toolkit</text>
    <text x="48" y="210" font-size="22" fill="#D3DEEC">Build retrieval. Inspect ranking. Evaluate changes.</text>
    <text x="48" y="267" font-size="14" fill="#9BADBF">PYTHON 3.11+  /  FASTAPI  /  STREAMLIT + PLOTLY  /  MIT</text>
    <g fill="none" stroke="#426078" stroke-width="2">
      <path d="M893 101h34l34 59h26M893 219h34l34-59M1083 160h32"/>
      <rect x="765" y="76" width="128" height="50" rx="10"/>
      <rect x="765" y="194" width="128" height="50" rx="10"/>
      <rect x="987" y="135" width="96" height="50" rx="10"/>
      <rect x="1115" y="135" width="116" height="50" rx="10"/>
    </g>
    <g font-size="15" text-anchor="middle" fill="#E4EDF7">
      <text x="829" y="107">BM25</text><text x="829" y="225">Dense</text>
      <text x="1035" y="166">Fusion</text><text x="1173" y="166">Inspect</text>
    </g>
    <text x="995" y="224" font-size="12" fill="#9BADBF">OPTIONAL RERANKING + STAGETRACE</text>
  </g>
</svg>
